[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indicf5-server"
version = "0.1.0"
description = "FastAPI server for AI4Bharat IndicF5 TTS, built to run on Vast.ai"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "soundfile",
    "numpy",
    "transformers",
    "huggingface_hub",
]

[project.scripts]
indicf5-server = "indicf5_server.server:main"

[tool.setuptools]
packages = ["indicf5_server"]